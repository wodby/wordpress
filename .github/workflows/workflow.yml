name: Build docker image

on:
  push:
    branches:
      - master

    tags:
      - '*'
      - '!*-r[0-9]*'

  pull_request:

env:
  BASE_IMAGE_REVISION: r2
  WORDPRESS_VER: '7.1.2'

jobs:
  build:
    strategy:
      matrix:
        php: [ '8.5', '8.4', '8.3', '8.2' ]
        arch:
          - amd64
          - arm64
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Build and test
        env:
          WORDPRESS_VER: '7.1.2'
          PHP_VER: ${{ matrix.php }}
          ARCH: ${{ matrix.arch }}
        run: |
          make
          make test
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push architecture image
        if: github.event_name == 'push'
        env:
          WORDPRESS_VER: '7.1.2'
          PHP_VER: ${{ matrix.php }}
          ARCH: ${{ matrix.arch }}
        run: make push

  push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs:
      - build
    strategy:
      matrix:
        php: [ '8.5', '8.4', '8.3', '8.2' ]
        include:
          # here we assume we have only one major version of WordPress, so all these "latest" tags applied on the last PHP version.
          - php: '8.5'
            latest: '1'
            latest_major_php: '1'
            latest_php: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: ./.github/actions
        with:
          version: ${{ env.WORDPRESS_VER }}
          php: ${{ matrix.php }}
          latest: ${{ matrix.latest }}
          # This branch publishes one stable WordPress track at a time, so the configured
          # series remains the latest major until the default version is changed.
          latest_major: 1
          latest_php: ${{ matrix.latest_php }}
          latest_major_php: ${{ matrix.latest_major_php }}

  image-revision-aliases:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/r')
    needs: [ push ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: image-revision-aliases-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: wodby/images/.github/actions/image-revision-aliases@412e2d9ce29c41835ff653b0945bba72eabd9efb
        with:
          docker_username: ${{ secrets.DOCKER_USERNAME }}
          docker_password: ${{ secrets.DOCKER_PASSWORD }}
